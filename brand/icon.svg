<svg width="512" height="512" viewBox="0 0 512 512" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#4F46E5"/>
      <stop offset="100%" style="stop-color:#7C3AED"/>
    </linearGradient>
  </defs>
  <rect width="512" height="512" rx="40" fill="url(#bg)"/>
  <!-- Shopping cart icon -->
  <g transform="translate(64, 64)">
    <!-- Cart body -->
    <path d="M48 64 L112 64 L112 40 L88 40 L88 24 L8 24 L8 40 L56 40 L56 64 Z" fill="white" stroke="#4F46E5" stroke-width="6" stroke-linejoin="round"/>
    <!-- Handle -->
    <path d="M96 32 L176 32 L176 8 L128 8 L128 72 L96 72 Z" fill="#4F46E5" stroke="#7C3AED" stroke-width="6" stroke-linejoin="round"/>
    <!-- Item inside cart -->
    <rect x="32" y="16" width="48" height="32" rx="6" fill="#E0E7FF" stroke="#4F46E5" stroke-width="4"/>
  </g>
  <!-- Credit/debt icon -->
  <g transform="translate(256, 290)">
    <!-- Coin/account circle -->
    <circle cx="0" cy="0" r="90" fill="none" stroke="#E0E7FF" stroke-width="20"/>
    <!-- Dollar sign -->
    <path d="M-60 -30 L-30 -30 L-30 0 L-60 0 Z" fill="#7C3AED"/>
    <path d="M-30 -30 L0 -30 L0 0 L-30 0 Z" fill="#7C3AED"/>
    <path d="M-30 0 L0 0 L0 30 L-30 30 Z" fill="#7C3AED"/>
    <path d="M0 0 L30 0 L30 30 L0 30 Z" fill="#7C3AED"/>
    <path d="M0 -30 L30 -30 L30 0 L0 0 Z" fill="#7C3AED"/>
    <path d="M-30 0 L0 0 L0 30 L-30 30 Z" fill="#7C3AED"/>
  </g>
</svg>
